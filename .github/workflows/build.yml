name: build

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SolYan.CorelAI.sln
      - name: Build
        run: dotnet build SolYan.CorelAI.sln -c Release --no-restore
